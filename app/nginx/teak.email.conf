server {
    listen 80;
    server_name teak.email;

    root /var/www/inboxapp/public;
    index index.php;

    # Hanya PHP + API + MCP yang di-serve
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/api(/.*)?$ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param PATH_INFO $1;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param PHP_VALUE "expose_php=Off";
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_param PHP_VALUE "expose_php=Off";
        include fastcgi_params;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:3456/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:3456/healthz;
    }

    # Hanya fallback ke 404.php jika URI benar-benar tidak ada
    location ~ ^/404\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        include fastcgi_params;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
