<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <g fill="none" stroke="url(#g)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Envelope body -->
    <rect x="4" y="9" width="24" height="16" rx="2"/>
    <!-- Envelope flap -->
    <polyline points="4,9 16,18 28,9"/>
    <!-- Arrow (inbox receiving) -->
    <line x1="16" y1="4" x2="16" y2="14"/>
    <polyline points="12,8 16,4 20,8"/>
  </g>
</svg>
