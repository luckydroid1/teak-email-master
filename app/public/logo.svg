<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72">
  <!-- Brand text BuyDomains -->
  <text x="2" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" font-style="italic" fill="#ffffff" letter-spacing="-0.04em">Buy<tspan fill="#60a5fa">Domains</tspan></text>
  
  <!-- Radar signal arcs & pointer -->
  <g transform="translate(208, 6) scale(0.65)">
    <!-- Red outer arc -->
    <path d="M 46 2 A 40 40 0 0 1 58 38" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Red mid arc -->
    <path d="M 32 10 A 28 28 0 0 1 42 34" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <!-- Red inner arc -->
    <path d="M 18 18 A 16 16 0 0 1 24 30" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Red lower arc -->
    <path d="M 28 44 A 28 28 0 0 1 12 40" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Blue Cursor click arrow -->
    <polygon points="10,24 16,42 22,34 32,40 35,35 25,29 33,25" fill="#38bdf8"/>
  </g>

  <!-- Tagline: By Network Solutions -->
  <text x="4" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="-0.01em">By <tspan font-weight="800" fill="#22c55e">Network Solutions</tspan></text>
</svg>